spring:
  application:
    name: collector-service
  threads:
    virtual:
      enabled: true   # ADR-0001: virtual threads for all blocking I/O
  # Defaults match .env.example (local development only); override via environment.
  # The collector role may only EXECUTE resolve_site_key(): no table privileges (ADR-0011).
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/insights}
    username: ${POSTGRES_COLLECTOR_USER:insights_collector}
    password: ${POSTGRES_COLLECTOR_PASSWORD:insights_collector_dev_pw}
    hikari:
      maximum-pool-size: 4    # lookups are cached; the pool only sees cache misses
  # ADR-0004 producer settings. A 202 is sent only after every record of the request is
  # acknowledged by all in-sync replicas; the timeouts keep an unreachable Kafka a fast 503.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      compression-type: zstd
      batch-size: 65536
      properties:
        enable.idempotence: true
        linger.ms: 20
        max.block.ms: 2000          # metadata wait when Kafka is unreachable
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000   # >= linger.ms + request.timeout.ms
        # replay chunks are up to 4 MB (topic max.message.bytes) plus the envelope
        max.request.size: 4259840

server:
  port: 8081

# Ingestion limits and tuning (CollectorProperties); the values below are the defaults.
collector:
  limits:
    max-events: 500
    max-events-body: 1MB       # decompressed
    max-replay-body: 4MB       # decompressed; = replay.chunks.v1 max.message.bytes
    max-event-age: 24h         # older client timestamps are dropped and counted
    max-clock-skew: 5m         # so are timestamps further in the future
  key-cache:                   # ADR-0011: revocation takes effect within positive-ttl
    positive-ttl: 60s
    negative-ttl: 10s
    maximum-size: 10000
  rate-limit:                  # per site key, per instance: 50 req/s, bursts of 100
    capacity: 100
    refill-tokens: 50
    refill-period: 1s
  kafka-send-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
