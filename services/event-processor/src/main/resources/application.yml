spring:
  application:
    name: event-processor
  threads:
    virtual:
      enabled: true   # ADR-0001: virtual threads for all blocking I/O (incl. Kafka listener threads)
  # ADR-0004 / ADR-0011: batch listeners, manual commit only after the batch is written.
  # Session lifecycle (Phase 5): the processor role, SELECT/INSERT/UPDATE on user_session and
  # end_user under RLS, plus claim_sessions_to_close(); never JPA, never migrations.
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/insights}
    username: ${POSTGRES_PROCESSOR_USER:insights_processor}
    password: ${POSTGRES_PROCESSOR_PASSWORD:insights_processor_dev_pw}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 5000          # an outage fails fast into the ADR-0011 back-off
      initialization-fail-timeout: -1   # pool creation never blocks on PostgreSQL (task 5.0)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # raw bytes: the listener parses envelopes itself, so a dead-lettered record keeps its exact value
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        # listener work per poll must finish within this, retries included (the error
        # handler keeps polling while it backs off)
        max.poll.interval.ms: 300000
    listener:
      type: batch
      ack-mode: batch
      # topics are declared by infra (kafka-init); start even if they do not exist yet
      missing-topics-fatal: false
    # dead-letter producer (ADR-0004 settings)
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      compression-type: zstd
      properties:
        enable.idempotence: true
        linger.ms: 20
        # Replay chunks are up to 16 MB decompressed (collector limit, Phase 4b). The producer
        # checks this before compression; the .dlt topic's max.message.bytes is checked on the
        # compressed batch. Below 16 MB a large poison chunk could never be dead-lettered and
        # would be retried forever.
        max.request.size: 17825792   # 17 MB

server:
  port: 8082

# Defaults match .env.example (local development only); override via environment.
processor:
  kafka:
    # = partitions per topic (KAFKA_TOPIC_PARTITIONS); more consumers than partitions sit idle
    concurrency: ${KAFKA_TOPIC_PARTITIONS:6}
    events:
      group-id: event-processor.events
      max-poll-records: 2000
      fetch-min-bytes: 262144      # wait for ~256 KB or fetch-max-wait-ms, for large inserts
      fetch-max-wait-ms: 500
    sessions:
      group-id: event-processor.sessions   # session tracker; poll settings as for events
    replay:
      group-id: event-processor.replay
      max-poll-records: 100
      fetch-max-wait-ms: 500
      # bounds what one poll holds: compressed batches, up to 16 MB each once decompressed
      fetch-max-bytes: 8388608            # 8 MB per fetch
      max-partition-fetch-bytes: 4194304  # 4 MB per partition (a larger batch still comes alone)
  clickhouse:
    endpoint: ${CLICKHOUSE_URL:http://localhost:8123}
    database: ${CLICKHOUSE_DB:insights}
    username: ${CLICKHOUSE_USER:insights}
    password: ${CLICKHOUSE_PASSWORD:insights_dev_pw}
    connect-timeout: 5s
    socket-timeout: 30s
    insert-timeout: 60s
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:8333}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_REPLAY_BUCKET:session-replays}
    access-key: ${S3_ACCESS_KEY:insights_dev_key}
    secret-key: ${S3_SECRET_KEY:insights_dev_secret}
    max-concurrency: 16            # parallel PUTs per batch
    api-call-timeout: 30s
  retry:                           # while a store is unavailable (ADR-0011)
    initial-interval: 500ms
    multiplier: 2.0
    max-interval: 30s
  replay:
    zstd-level: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
