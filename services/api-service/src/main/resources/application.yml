spring:
  application:
    name: api-service
  threads:
    virtual:
      enabled: true   # ADR-0001: virtual threads for all blocking I/O
  # Defaults match .env.example (local development only); override via environment.
  # The app connects as the non-owner role so row-level security applies (ADR-0008);
  # Flyway connects as the schema owner and creates that role (V3).
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/insights?reWriteBatchedInserts=true}
    username: ${POSTGRES_APP_USER:insights_app}
    password: ${POSTGRES_APP_PASSWORD:insights_app_dev_pw}
  flyway:
    user: ${POSTGRES_USER:insights}
    password: ${POSTGRES_PASSWORD:insights_dev_pw}
    locations: classpath:db/migration/postgres
    placeholders:
      appUser: ${POSTGRES_APP_USER:insights_app}
      appPassword: ${POSTGRES_APP_PASSWORD:insights_app_dev_pw}
      collectorUser: ${POSTGRES_COLLECTOR_USER:insights_collector}
      collectorPassword: ${POSTGRES_COLLECTOR_PASSWORD:insights_collector_dev_pw}
      processorUser: ${POSTGRES_PROCESSOR_USER:insights_processor}
      processorPassword: ${POSTGRES_PROCESSOR_PASSWORD:insights_processor_dev_pw}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema
    properties:
      hibernate:
        jdbc:
          batch_size: 50          # with reWriteBatchedInserts=true on the JDBC URL
        order_inserts: true
        order_updates: true

clickhouse:
  endpoint: ${CLICKHOUSE_URL:http://localhost:8123}
  database: ${CLICKHOUSE_DB:insights}
  username: ${CLICKHOUSE_USER:insights}
  password: ${CLICKHOUSE_PASSWORD:insights_dev_pw}

server:
  port: 8080
  compression:              # replay chunks are JSON of up to 16 MB
    enabled: true
    mime-types: application/json
    min-response-size: 2KB

# Dev-grade API authentication (ADR-0013): dev profile only, HTTP Basic with this password for
# any active app user's email. Every other profile refuses to start until OIDC (Phase 11).
api:
  dev-auth:
    password: ${DEV_ADMIN_PASSWORD:}

# Replay objects (read-only here; event-processor writes them). Defaults match .env.example.
s3:
  endpoint: ${S3_ENDPOINT:http://localhost:8333}
  region: ${S3_REGION:us-east-1}
  bucket: ${S3_REPLAY_BUCKET:session-replays}
  access-key: ${S3_ACCESS_KEY:insights_dev_key}
  secret-key: ${S3_SECRET_KEY:insights_dev_secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
